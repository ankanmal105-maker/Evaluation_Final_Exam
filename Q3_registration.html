<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <style>
    body {
      background-color: #eef3f8;
      color: #222;
      font-family: Arial, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }
    h1 {
      color: #1a4d8f;
      margin-bottom: 20px;
    }
    form {
      background: #fff;
      max-width: 400px;
      margin: 0 auto 30px;
      padding: 20px;
      border-radius: 8px;
      text-align: left;
    }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      padding: 10px 24px;
      background-color: #1a4d8f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      width: 100%;
      max-width: 600px;
    }
    th, td { border: 1px solid #bbb; padding: 10px; }
    th { background-color: #1a4d8f; color: #fff; }
  </style>
</head>
<body>
  <h1>Student Registration</h1>

  <form>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label for="course">Course</label>
    <input type="text" id="course" placeholder="Enter your course">

    <button type="submit">Register</button>
  </form>

  <h2>Registered Students</h2>
  <table>
    <tr><th>Name</th><th>Email</th><th>Course</th></tr>
    <tr><td>Ankan Mal</td><td>ankanmal@example.com</td><td>BCA</td></tr>
    <tr><td>Ihsan jamil</td><td>ihsanjamil@example.com</td><td>BCA</td></tr>
    <tr><td>Krishna Jana</td><td>krishnajana@example.com</td><td>BCA</td></tr>
  </table>
</body>
</html>
